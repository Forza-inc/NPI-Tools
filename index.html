<style>
  /* Kallisto Heavy = brand heading font. Uses the installed font if present;
     to embed it for everyone, drop Kallisto-Heavy.woff2 next to this file. */
  @font-face {
    font-family: "Kallisto";
    src: local("Kallisto Heavy"), local("Kallisto-Heavy"), url("Kallisto-Heavy.woff2") format("woff2");
    font-weight: 800; font-display: swap;
  }
  :root {
    --regal-blue: #1B3764;
    --blaze-orange: #F16022;
    --blue-velvet: #09668D;
    --rusty-nail: #D35127;
    --slate-grey: #BFBFBF;
    --iron-grey: #DBDAD9;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--regal-blue);
    color: var(--white);
    font-family: "Poppins", system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 56px 16px 48px; }
  header { text-align: center; margin-bottom: 48px; }
  header img { width: min(320px, 70vw); height: auto; display: block; margin: 0 auto 32px; }
  h1 {
    font-family: "Kallisto", "Poppins", sans-serif; font-weight: 800;
    font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: .04em; text-transform: uppercase;
  }
  h1 span { color: var(--blaze-orange); }
  header p { margin-top: 10px; color: var(--iron-grey); font-size: 1rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 14px;
    padding: 26px 24px 22px; border-radius: 14px; text-decoration: none; color: var(--regal-blue);
    background: #F2F1EE; border: 2px solid transparent;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: var(--blaze-orange); box-shadow: 0 12px 28px rgba(0,0,0,.28); outline: none; }
  .icon {
    width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
    background: var(--blaze-orange);
  }
  .icon svg { width: 26px; height: 26px; stroke: var(--white); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card h2 { font-family: "Kallisto", "Poppins", sans-serif; font-weight: 800; font-size: 1.15rem; letter-spacing: .03em; text-transform: uppercase; }
  .card p { color: #3F444B; font-size: .92rem; line-height: 1.55; flex: 1; }
  .launch { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .85rem; color: var(--blaze-orange); text-transform: uppercase; letter-spacing: .06em; }
  .launch svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; transition: transform .18s; }
  .card.soon { cursor: default; opacity: .75; }
  .card.soon:hover { transform: none; border-color: transparent; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .launch.muted { color: #77787B; }
  .card:hover .launch svg { transform: translateX(4px); }
  .tag { position: absolute; top: 18px; right: 18px; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #5A5F66; background: rgba(27,55,100,.10); padding: 3px 8px; border-radius: 999px; }

  footer { text-align: center; padding: 32px 16px 28px; }
  .slogan { font-family: "Kallisto", "Poppins", sans-serif; font-weight: 800; font-size: clamp(1rem, 2.4vw, 1.35rem); letter-spacing: .03em; line-height: 1.3; }
  .slogan .s1 { color: var(--white); }
  .slogan .s2 { color: #77787B; }
  .slogan .s3 { color: var(--blaze-orange); }
  .site { display: inline-block; margin-top: 10px; font-size: .85rem; color: var(--slate-grey); text-decoration: none; }
  .site:hover { color: var(--blaze-orange); }
</style>
</head>

<script>
/* ================================================================

const APPS = [
  {
    name: "SDS Generator",
    desc: "Build new Safety Data Sheets from product data, ready for review and release.",
    url: "https://mjgsdscreator.streamlit.app/",
    icon: "flask",
    tag: "Streamlit"
  },
  {
    name: "SDS Formatter",
    desc: "Reformat and rebrand Safety Data Sheets across all six vertical templates — English, French, and Spanish.",
    url: "https://forzasds.streamlit.app/",
    icon: "doc",
    tag: "Streamlit"
  },
  {
    name: "TDS Generator",
    desc: "Generate branded Technical Data Sheets across every Forza product line.",
    url: "https://my9eti6uagg3wynvrvtlis.streamlit.app/",
    icon: "chart",
    tag: "Streamlit"
  },
  {
    name: "Label Generator",
    desc: "Turn SDS/TDS PDFs into print-ready product labels for every vertical and package size.",
    url: "https://labelmaker-ezdlkfqhpynvzjgwjufxjr.streamlit.app/",
    icon: "label",
    tag: "Streamlit"
  }
];

const ICONS = {
  doc:    '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  label:  '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  chart:  '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  flask:  '<path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7 15h10"/>',

};
const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

document.getElementById("apps").innerHTML = APPS.map(a => {
  const live = !!a.url;
  const open = live ? `<a class="card" href="${a.url}" target="_blank" rel="noopener">` : `<div class="card soon" aria-disabled="true">`;
  const close = live ? `</a>` : `</div>`;
  return `${open}

    <div class="icon"><svg viewBox="0 0 24 24">${ICONS[a.icon] || ICONS.grid}</svg></div>

    <p>${a.desc}</p>
    ${live ? `<span class="launch">Launch ${ARROW}</span>` : `<span class="launch muted">Coming Soon</span>`}
  ${close}`;
}).join("");
